[package]
name = "core-rs"
version = "0.1.0"
edition = "2021"
description = "Rust Web 应用框架：集成 axum / SeaORM 2 / 配置热更新 / 中间件 / 认证授权 / 可插拔缓存与队列"
license = "MIT"
rust-version = "1.85"

[lib]
name = "core_rs"

[features]
default = ["cache-memory", "queue-memory", "sqlite", "watch"]

# ---- 数据库（sea-orm 2 运行时后端，默认 sqlite）----
sqlite = ["sea-orm/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]

# ---- 缓存与锁（可插拔后端）----
cache-memory = ["dep:moka"]
cache-redis = ["dep:deadpool-redis", "dep:redis", "redis/streams", "redis/connection-manager"]

# ---- 队列（可插拔后端）----
queue-memory = []
queue-redis = ["dep:deadpool-redis", "dep:redis", "redis/streams", "redis/connection-manager"]
queue-rabbitmq = ["dep:lapin"]
queue-kafka = ["dep:rdkafka"]
queue-nats = ["dep:async-nats"]

# ---- 配置 ----
watch = ["dep:notify"]
config-remote = ["dep:reqwest"]

# ---- 认证与授权 ----
session = []
jwt = ["dep:jsonwebtoken"]
oauth2 = ["dep:oauth2", "dep:reqwest"]
casbin = ["dep:casbin"]

# ---- 实时通信 ----
ws = ["axum/ws"]
sse = []

# ---- 服务端 TLS（HTTPS / 多域名证书 / 热更新）----
tls = ["dep:axum-server", "dep:rustls", "dep:rustls-pemfile", "dep:x509-parser", "dep:notify"]

# ---- 运维件 ----
scheduler = ["dep:tokio-cron-scheduler"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
rate-limit = []
csrf = []
i18n = ["dep:fluent", "dep:unic-langid"]
log-file = ["dep:rotate-rs"]

# ---- 测试装配器 ----
testing = ["tower/util"]

[dependencies]
# web
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "net",
    "fs",
    "io-util",
    "time",
    "sync",
] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "timeout",
    "limit",
    "compression-gzip",
    "catch-panic",
] }
futures = "0.3"

# orm
sea-orm = { version = "2", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
] }

# config
config = { version = "0.15", features = ["toml"] }
arc-swap = "1"
notify = { version = "8", optional = true }

# log
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
log = "0.4"

# ser/de & validation（文档 三·9：garde，不引入 validator）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
garde = { version = "0.20", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
# 时区常驻依赖：统一的 IANA 时区解析（日志 / cron / 展示换算），
# 不再挂在 i18n / scheduler 可选 feature 下——时区能力在默认构建下也必须可用
chrono-tz = "0.10"

# error
thiserror = "2"

# 通用
# async-trait 常驻：observability/cache/auth 等常开模块无条件使用，
# 曾经只靠 queue-memory 等可选 feature 顺带引入（隐式 feature 耦合）
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
# 常量时间比较（security/crypto 的 HMAC 校验）
subtle = "2"

# cache-redis / queue-redis
deadpool-redis = { version = "0.21", optional = true, features = ["rt_tokio_1"] }
redis = { version = "0.31", optional = true, features = ["script"] }
moka = { version = "0.12", optional = true, default-features = false, features = ["future"] }

# queue 可选后端
lapin = { version = "2", optional = true }
rdkafka = { version = "0.36", optional = true, features = ["tokio"] }
async-nats = { version = "0.35", optional = true }

# auth 可选能力
jsonwebtoken = { version = "11", optional = true, features = ["rust_crypto"] }
oauth2 = { version = "4", optional = true, default-features = false, features = ["reqwest", "rustls-tls"] }
casbin = { version = "2", optional = true, default-features = false, features = ["runtime-tokio"] }

# task / i18n / metrics / otel 可选能力
tokio-cron-scheduler = { version = "0.15", optional = true }
fluent = { version = "0.16", optional = true }
unic-langid = { version = "0.9", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true }
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = [
    "trace",
    "grpc-tonic",
] }
tracing-opentelemetry = { version = "0.34", optional = true }

# oauth2 / config-remote 共用的 HTTP 客户端
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "json",
    "rustls",
    "webpki-roots",
] }

# 服务端 TLS（feature = "tls"）：axum-server + rustls（crypto provider = ring）
# tls-rustls-no-provider：不强制 aws-lc-rs，provider 由框架显式选择（避免与 sqlx/reqwest 冲突）
axum-server = { version = "0.8", optional = true, default-features = false, features = [
    "tls-rustls-no-provider",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = { version = "2", optional = true }
# 证书到期监控：从证书 DER 中取 notAfter
x509-parser = { version = "0.18", optional = true }

# security/crypto（文档 三·16）
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }

# v0.4：日志文件轮转（rotate-rs：时间/大小/混合切割 + gz 压缩 + 非阻塞写入）
rotate-rs = { git = "https://github.com/pangshu/rotate-rs", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
# TLS 测试：现场生成自签证书 + 以 rustls 客户端做真实握手（SNI 选择 / 热更新）
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
