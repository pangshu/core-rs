[package]
name = "core-rs"
version = "0.4.0"
edition = "2021"
description = "Rust 后端快速开发基础框架：薄封装 axum + SeaORM + Redis"
license = "MIT"
rust-version = "1.85"

[lib]
name = "core_rs"

[[bin]]
name = "core-rs"
path = "src/bin/core.rs"
required-features = ["cli"]

[features]
default = ["sqlite", "migration", "watch"]
sqlite = ["sea-orm/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]
migration = ["dep:sea-orm-migration"]
# v0.3 可选能力：全部默认关闭，按需启用
jwt = ["dep:jsonwebtoken", "dep:argon2", "dep:rand_core"]
swagger = ["dep:utoipa", "dep:utoipa-swagger-ui"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
http-client = ["dep:reqwest"]
scheduler = ["dep:tokio-cron-scheduler"]
rate-limit = ["dep:tower_governor"]
dist-lock = ["dep:uuid", "dep:redis"]
# 缓存双后端：auto/redis 用 deadpool-redis，memory 用 moka 进程内 TTL 缓存
cache-memory = ["dep:moka"]
# 测试辅助（业务项目在 dev-dependencies 中启用）
test-util = []
websocket = ["axum/ws"]
upload = ["axum/multipart", "tower-http/fs", "dep:uuid"]
cli = ["dep:clap"]
# v0.4：日志文件轮转（rotate-rs：时间/大小/混合切割 + gz 压缩 + 非阻塞写入）
log-file = ["dep:rotate-rs"]
# v0.4：配置热更新（文件变更自动重载 + OnChange 回调），默认开启
watch = ["dep:notify"]
# v0.4：消息队列（memory 内置；redis 后端 = Redis Streams 消费组，at-least-once）
queue = ["dep:async-trait", "redis/streams", "redis/connection-manager"]

[dependencies]
# web
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "net",
    "fs",
    "io-util",
] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "timeout",
    "limit",
    "request-id",
    "compression-gzip",
    "catch-panic",
] }

# orm
sea-orm = { version = "2", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = { version = "2", optional = true, default-features = false, features = [
    "runtime-tokio-rustls",
    "with-chrono",
] }

# cache
deadpool-redis = { version = "0.21", features = ["rt_tokio_1"] }
moka = { version = "0.12", optional = true, default-features = false, features = ["future"] }

# config
config = { version = "0.15", features = ["yaml"] }

# log
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"

# ser/de & validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# error
thiserror = "2"

# v0.3 可选依赖（按 feature 启用）
jsonwebtoken = { version = "11", optional = true, features = ["rust_crypto"] }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
argon2 = { version = "0.5", optional = true }
utoipa = { version = "6", optional = true, features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10", optional = true, features = ["axum"] }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true }
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = [
    "trace",
    "grpc-tonic",
] }
tracing-opentelemetry = { version = "0.34", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "json",
    "rustls",
    "webpki-roots",
] }
tokio-cron-scheduler = { version = "0.15", optional = true }
tower_governor = { version = "0.8", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
redis = { version = "0.31", optional = true, features = ["script"] }
clap = { version = "4", optional = true, features = ["derive"] }

# v0.4 可选依赖（按 feature 启用）
rotate-rs = { git = "https://github.com/pangshu/rotate-rs", optional = true }
notify = { version = "8", optional = true }
arc-swap = "1"
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
