# 示例配置 —— production（AURORA_ENV=production）
#
# ⚠️ 这份文件会**触发生产护栏**：JWT 密钥必填、CORS 禁 `*`、`/metrics` 需令牌……
# 本示例只演示"换一个 AURORA_ENV 就换一份配置"，因此真正跑起来要补环境变量：
#   AURORA_ENV=production AURORA_AUTH__JWT__SECRET=<≥32 字节> cargo run --example config_multi_env

[app]
name = "config-demo (production)"

[server]
host = "127.0.0.1"
port = 8092

[telemetry]
level = "warn"
format = "json"
